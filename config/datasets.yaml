# Phase 7 dataset manifest. Policy (D8-update): ANY PUBLIC source allowed; license
# is RECORDED per source; model is NOT redistributed unless all licenses permissive.
# Loader verifies each entry exists + records license before use (anti-hallucination:
# every entry starts verified:false and must be checked, not assumed).
sources:
  - name: smartbugs-curated
    url: "https://github.com/smartbugs/smartbugs-curated"
    license: "unknown"        # verify on ingest
    split: "train"
    verified: false
  - name: swc-registry
    url: "https://github.com/SmartContractSecurity/SWC-registry"
    license: "unknown"
    split: "train"
    verified: false
# NOTE: benchmark names from the GPT spec (EVMbench, SCONE-bench, Forest-of-Audits)
# are UNVERIFIED and deliberately NOT listed until existence+license are confirmed.
  - name: cve-smart-contracts-2026-08
    url: "https://zenodo.org/ (CVE Smart Contracts, Aug 2026, 491 labeled)"
    license: "unknown"
    split: "train"
    verified: false
  - name: solidifi
    url: "https://github.com/DependableSystemsLab/SolidiFI-benchmark"
    license: "unknown"
    split: "eval"
    verified: false
  - name: web3bugs
    url: "https://github.com/ZhangZhuoSJTU/Web3Bugs"
    license: "unknown"
    split: "eval"
    verified: false

# --- added 2026-11-05 (verified, not blindly ingested) ---
FORGE-Artifacts:
  url: https://github.com/shenyimings/FORGE-Artifacts
  license: MIT
  kind: real-audit-findings
  raw_findings: 27495
  used: security-relevant only (Info/N-A + gas/style/docs dropped via quality gate)
  note: capability A (detect, source windowed to finding line) + B (explain finding)
FORGE-Curated:
  url: https://github.com/shenyimings/FORGE-Curated
  license: MIT
  kind: real-audit-findings (recent, 11 top-tier firms, source inline)
CVE-Smart-Contracts:
  url: https://github.com/smartbugs/CVE-Smart-Contracts
  license: mixed-public (contracts from Etherscan; repo code MIT)
  kind: CVE/SWC-labeled, manually reviewed
  used: reviewed non-refuted matches ONLY (491 records, all with localization)
evaluated_rejected:
  smartbugs-wild: unlabeled 47k, solc 0.4.x — fails modern compile; no supervised labels
  gsalzer/cgt: 20k manual labels but old-era + heavy SmartBugs overlap (dedup risk); available on request
  CoderDamien/smart-contract-vuln-dataset: tiny (1.5MB), re-packaged public sets — dup risk
  Zellic/smart-contract-fiesta: large UNLABELED corpus — useful as scan targets, not training labels
  Fernan7w7/evm-trace-dataset: execution traces, wrong modality for source-level vuln training
