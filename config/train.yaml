# Phase 7 training config — switch the base model to train by editing THIS FILE.
base_model: "Qwen/Qwen2.5-Coder-14B-Instruct"   # HF id; swap freely
base_revision: "main"
method: "qlora"                 # qlora | lora | full
quantization: "nf4"             # 4-bit base for QLoRA
lora: { r: 16, alpha: 32, dropout: 0.05, target_modules: "all-linear" }
train:
  seq_len: 4096
  lr: 1.0e-4
  epochs: 3
  batch_size: 1
  grad_accum: 16
  seed: 0
  bf16: true
eval:
  holdout_split: "test"
  metrics: ["recall", "fp_rate", "poc_repro_rate"]
output_dir: "model/adapters"
# Reproducibility: pinned requirements + seed; logs + eval report saved as artifacts.
