# Switch the base model to train by editing base_model (or --base). Everything below
# is model- and hardware-agnostic: the same config scales to A100/multi-GPU unchanged.
base_model: "Qwen/Qwen2.5-Coder-7B-Instruct"
base_revision: "main"
method: "qlora"            # qlora | lora | full
quantization: "nf4"
lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: "all-linear"
train:
  seq_len: 1024
  lr: 2.0e-4
  epochs: 2
  batch_size: 1
  grad_accum: 16
  warmup_ratio: 0.03
  weight_decay: 0.01
  lr_scheduler: "cosine"
  max_grad_norm: 0.3
  logging_steps: 5
  eval_steps: 25
  save_steps: 50
  save_total_limit: 3
  seed: 0
  optim: "paged_adamw_8bit"
  attn_implementation: "sdpa"
  group_by_length: true
output_dir: "model/adapters"
eval:
  detection_accuracy: true
  poc_structural: true
